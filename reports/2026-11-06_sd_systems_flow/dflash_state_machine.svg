<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170" role="img" aria-label="DFlash 状态机">
<title>DFlash · 横版状态机</title><desc>单卡基本状态机。一次 draft forward 后验证，接受部分或全部候选，再提交状态并进入下一轮。</desc>
<defs><marker id="dflash-arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#607b91"/></marker><marker id="dflash-arrow-miss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#bf6556"/></marker><marker id="dflash-arrow-commit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#8663b0"/></marker><marker id="dflash-arrow-verify" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#228978"/></marker><marker id="dflash-arrow-draft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#3974bf"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}.state:hover rect{filter:brightness(.98)}.edge-label{pointer-events:none}</style>
<rect width="1600" height="1170" fill="#fff"/><path class="transition normal" d="M54 200H90" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#dflash-arrow-normal)"/><path class="transition normal" d="M330 200H440" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#dflash-arrow-normal)"/><path class="transition normal" d="M720 200H845" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#dflash-arrow-normal)"/><path class="transition normal" d="M1125 200H1250" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#dflash-arrow-normal)"/><path class="transition verify" d="M1390 261V440" fill="none" stroke="#228978" stroke-width="2.1" marker-end="url(#dflash-arrow-verify)"/><path class="transition verify" d="M1250 498H1099" fill="none" stroke="#228978" stroke-width="2.1" marker-end="url(#dflash-arrow-verify)"/><path class="transition commit" d="M1080 479V375H810V440" fill="none" stroke="#8663b0" stroke-width="2.1" marker-end="url(#dflash-arrow-commit)"/><path class="transition commit" d="M1080 517V650H810V579" fill="none" stroke="#8663b0" stroke-width="2.1" marker-end="url(#dflash-arrow-commit)"/><path class="transition commit" d="M665 510H519" fill="none" stroke="#8663b0" stroke-width="2.1" marker-end="url(#dflash-arrow-commit)"/><path class="transition commit" d="M500 491V261" fill="none" stroke="#8663b0" stroke-width="2.1" marker-end="url(#dflash-arrow-commit)"/><path class="transition normal" d="M500 529V740" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#dflash-arrow-normal)"/><circle cx="45" cy="200" r="9" fill="#213f57"/><g id="dflash-prefill" class="state" data-kind="verify"><rect x="90" y="145" width="240" height="116" rx="14" fill="#eaf7f3" stroke="#228978" stroke-width="1.8"/><path d="M91 188H329" stroke="#228978" stroke-opacity=".3"/><text x="106" y="174" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="106" dy="0">Prefill 执行中</tspan></text><text x="106" y="214" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="106" dy="0">do：target 处理 prompt</tspan><tspan x="106" dy="23">产出 KV / H、anchor</tspan></text></g><g id="dflash-ready" class="state" data-kind="state"><rect x="440" y="145" width="280" height="116" rx="14" fill="#f7fafc" stroke="#7892a7" stroke-width="1.8"/><path d="M441 188H719" stroke="#7892a7" stroke-opacity=".3"/><text x="456" y="174" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="456" dy="0">Context ready</tspan></text><text x="456" y="214" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="456" dy="0">真实 prefix KV / H 已确认</tspan><tspan x="456" dy="23">anchor 已知，等待生成草稿</tspan></text></g><g id="dflash-draft" class="state" data-kind="draft"><rect x="845" y="145" width="280" height="116" rx="14" fill="#edf4ff" stroke="#3974bf" stroke-width="1.8"/><path d="M846 188H1124" stroke="#3974bf" stroke-opacity=".3"/><text x="861" y="174" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="861" dy="0">Draft 执行中</tspan></text><text x="861" y="214" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="861" dy="0">do：并行 forward × 1</tspan><tspan x="861" dy="23">anchor + MASK → logits</tspan></text><a href="#dflash-module-m1" aria-label="查看 M1 模块"><rect x="1047" y="156" width="28" height="22" rx="5" fill="#fff" stroke="#3974bf" stroke-opacity=".5"/><text x="1061" y="172" text-anchor="middle" font-size="12" font-weight="650" fill="#3974bf">M1</text></a><a href="#dflash-module-m2" aria-label="查看 M2 模块"><rect x="1080" y="156" width="28" height="22" rx="5" fill="#fff" stroke="#3974bf" stroke-opacity=".5"/><text x="1094" y="172" text-anchor="middle" font-size="12" font-weight="650" fill="#3974bf">M2</text></a></g><g id="dflash-proposal" class="state" data-kind="control"><rect x="1250" y="145" width="280" height="116" rx="14" fill="#fff6e7" stroke="#b47a24" stroke-width="1.8"/><path d="M1251 188H1529" stroke="#b47a24" stroke-opacity=".3"/><text x="1266" y="174" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="1266" dy="0">候选就绪</tspan></text><text x="1266" y="214" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="1266" dy="0">entry：argmax / sampling</tspan><tspan x="1266" dy="23">持有完整线性候选 block</tspan></text><a href="#dflash-module-m1" aria-label="查看 M1 模块"><rect x="1485" y="156" width="28" height="22" rx="5" fill="#fff" stroke="#b47a24" stroke-opacity=".5"/><text x="1499" y="172" text-anchor="middle" font-size="12" font-weight="650" fill="#b47a24">M1</text></a></g><g id="dflash-verify" class="state" data-kind="verify"><rect x="1250" y="440" width="280" height="116" rx="14" fill="#eaf7f3" stroke="#228978" stroke-width="1.8"/><path d="M1251 483H1529" stroke="#228978" stroke-opacity=".3"/><text x="1266" y="469" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="1266" dy="0">Verify 执行中</tspan></text><text x="1266" y="509" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="1266" dy="0">do：target causal extend</tspan><tspan x="1266" dy="23">输入 anchor + 当前候选</tspan></text></g><path d="M1080 479 L1099 498 L1080 517 L1061 498Z" fill="#fff9ed" stroke="#b47a24" stroke-width="1.8"/><g id="dflash-commit" class="state" data-kind="commit"><rect x="665" y="440" width="285" height="139" rx="14" fill="#f4effb" stroke="#8663b0" stroke-width="1.8"/><path d="M666 483H949" stroke="#8663b0" stroke-opacity=".3"/><text x="681" y="469" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="681" dy="0">Commit 执行中</tspan></text><text x="681" y="509" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="681" dy="0">保留接受前缀的 KV / H</tspan><tspan x="681" dy="23">输出 correction / bonus</tspan><tspan x="681" dy="23">丢弃其余候选与临时状态</tspan></text></g><path d="M500 491 L519 510 L500 529 L481 510Z" fill="#fff9ed" stroke="#b47a24" stroke-width="1.8"/><g class="final"><circle cx="500" cy="755" r="15" fill="#fff" stroke="#213f57" stroke-width="2"/><circle cx="500" cy="755" r="9" fill="#213f57"/></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="1080" y="465" text-anchor="middle" font-size="15" fill="#3f5b71" font-weight="500"><tspan x="1080" dy="0">target 返回</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="500" y="477" text-anchor="middle" font-size="15" fill="#3f5b71" font-weight="500"><tspan x="500" dy="0">是否结束</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="386" y="181" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="386" dy="0">prefill 完成</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="782" y="181" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="782" dy="0">开始本轮</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="1188" y="181" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="1188" dy="0">forward 完成</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="1460" y="346" text-anchor="middle" font-size="15" fill="#228978" font-weight="500"><tspan x="1460" dy="0">候选就绪</tspan><tspan x="1460" dy="23">提交 target</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="1170" y="479" text-anchor="middle" font-size="15" fill="#228978" font-weight="500"><tspan x="1170" dy="0">logits 就绪</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="933" y="340" text-anchor="middle" font-size="15" fill="#8663b0" font-weight="500"><tspan x="933" dy="0">[首个拒绝位置 k+1]</tspan><tspan x="933" dy="23">接受前 k 个；产生 correction</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="946" y="685" text-anchor="middle" font-size="15" fill="#8663b0" font-weight="500"><tspan x="946" dy="0">[γ 个候选全部接受]</tspan><tspan x="946" dy="23">接受整块；产生 bonus</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="594" y="490" text-anchor="middle" font-size="15" fill="#8663b0" font-weight="500"><tspan x="594" dy="0">状态提交完成</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="420" y="370" text-anchor="middle" font-size="15" fill="#8663b0" font-weight="500"><tspan x="420" dy="0">[继续]</tspan><tspan x="420" dy="23">新 anchor / 新 H</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="398" y="668" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="398" dy="0">[EOS / token budget]</tspan></text></g><text x="71" y="780" text-anchor="start" font-size="15" fill="#698095" font-weight="400"><tspan x="71" dy="0">GPU 常驻：target KV、draft prefix KV、真实 target 特征 H。</tspan><tspan x="71" dy="23">每个 block 一次 draft forward；这里没有反复 denoise / Jacobi 的状态回环。</tspan></text><text x="1060" y="800" text-anchor="start" font-size="15" fill="#698095" font-weight="400"><tspan x="1060" dy="0">单轮关键依赖：draft 完成 → target verify。</tspan><tspan x="1060" dy="23">verify 结果更新 context 后，下一轮才重新 draft。</tspan></text>
<path d="M50 896H1550" stroke="#e0e8ee"/><rect x="50" y="919" width="12" height="12" rx="3" fill="#edf4ff" stroke="#3974bf"/><text x="71" y="930" font-size="14" fill="#698095">draft / 预测计算</text><rect x="255" y="919" width="12" height="12" rx="3" fill="#fff6e7" stroke="#b47a24"/><text x="276" y="930" font-size="14" fill="#698095">控制 / 调度</text><rect x="460" y="919" width="12" height="12" rx="3" fill="#eaf7f3" stroke="#228978"/><text x="481" y="930" font-size="14" fill="#698095">target verify</text><rect x="665" y="919" width="12" height="12" rx="3" fill="#f4effb" stroke="#8663b0"/><text x="686" y="930" font-size="14" fill="#698095">状态提交</text><rect x="870" y="919" width="12" height="12" rx="3" fill="#fff0ed" stroke="#c16959"/><text x="891" y="930" font-size="14" fill="#698095">fallback</text><text x="1545" y="930" text-anchor="end" font-size="14" fill="#698095">箭头：事件 / [条件] → 动作　　● 初态　◎ 终态</text>
<text x="50" y="973" text-anchor="start" font-size="17" fill="#314c63" font-weight="700"><tspan x="50" dy="0">模块速览 · M 标记对应状态中执行的模型</tspan></text><text x="1550" y="973" text-anchor="end" font-size="14" fill="#698095" font-weight="400"><tspan x="1550" dy="0">B 批量 · P prefix · q/Q query · γ 预测位置 · h hidden · m 特征层数 · V 词表</tspan></text><g class="module-card" id="dflash-module-m1"><rect x="50.0" y="990" width="742.0" height="140" rx="12" fill="#f8fafc" stroke="#cbd8e2"/><rect x="65.0" y="1004" width="33" height="24" rx="5" fill="#e5eef8"/><text x="81.5" y="1022" text-anchor="middle" font-size="14" fill="#3974bf" font-weight="700"><tspan x="81.5" dy="0">M1</tspan></text><text x="109.0" y="1022" text-anchor="start" font-size="20" fill="#18364e" font-weight="700"><tspan x="109.0" dy="0">Draft model</tspan></text><text x="777.0" y="1021" text-anchor="end" font-size="14" fill="#698095" font-weight="400"><tspan x="777.0" dy="0">基础</tspan></text><text x="66.0" y="1052" text-anchor="start" font-size="17" fill="#314c63" font-weight="500"><tspan x="66.0" dy="0">L_d 层 Transformer · block 内双向 attention</tspan></text><text x="66.0" y="1078" text-anchor="start" font-size="17" fill="#4b6479" font-weight="400"><tspan x="66.0" dy="0">H[B,P,mh] + query IDs[B,q]</tspan><tspan x="66.0" dy="23">→ Z[B,γ,h] → 共享 LM head → U[B,γ,V]</tspan></text></g><g class="module-card" id="dflash-module-m2"><rect x="808.0" y="990" width="742.0" height="140" rx="12" fill="#f8fafc" stroke="#cbd8e2"/><rect x="823.0" y="1004" width="33" height="24" rx="5" fill="#e5eef8"/><text x="839.5" y="1022" text-anchor="middle" font-size="14" fill="#3974bf" font-weight="700"><tspan x="839.5" dy="0">M2</tspan></text><text x="867.0" y="1022" text-anchor="start" font-size="20" fill="#18364e" font-weight="700"><tspan x="867.0" dy="0">Context converter · draft 内部</tspan></text><text x="1535.0" y="1021" text-anchor="end" font-size="14" fill="#698095" font-weight="400"><tspan x="1535.0" dy="0">基础</tspan></text><text x="824.0" y="1052" text-anchor="start" font-size="17" fill="#314c63" font-weight="500"><tspan x="824.0" dy="0">Linear(mh,h) + RMSNorm</tspan></text><text x="824.0" y="1078" text-anchor="start" font-size="17" fill="#4b6479" font-weight="400"><tspan x="824.0" dy="0">H[B,P,mh] → C[B,P,h]</tspan><tspan x="824.0" dy="23">每层将 C 投影为 prefix K/V；不预测未来 H</tspan></text></g><text x="50" y="1153" text-anchor="start" font-size="14" fill="#698095" font-weight="400"><tspan x="50" dy="0">形状以共享 h 的 Qwen3-8B 式模型为例：h=4096；L_d、m 依 checkpoint；γ 为选取后的预测位置数。共享 LM head = Linear(h,V)。</tspan></text>
</svg>