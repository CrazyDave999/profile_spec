<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170" role="img" aria-label="DSpark 状态机">
<title>DSpark · 横版状态机</title><desc>包含并行 draft 与历史预算的并发区域；Markov 采样有位置内循环，验证后回到新 context。</desc>
<defs><marker id="dspark-arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#607b91"/></marker><marker id="dspark-arrow-miss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#bf6556"/></marker><marker id="dspark-arrow-commit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#8663b0"/></marker><marker id="dspark-arrow-verify" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#228978"/></marker><marker id="dspark-arrow-draft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#3974bf"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}.state:hover rect{filter:brightness(.98)}.edge-label{pointer-events:none}</style>
<rect width="1600" height="1170" fill="#fff"/><rect x="370" y="85" width="940" height="475" rx="22" fill="#fbfcfe" stroke="#bdccd8" stroke-width="1.6" stroke-dasharray="7 5"/><text x="390" y="114" text-anchor="start" font-size="18" fill="#314c63" font-weight="700"><tspan x="390" dy="0">ROUND PREPARATION · 两个并发区域</tspan></text><text x="390" y="138" text-anchor="start" font-size="14" fill="#688096" font-weight="400"><tspan x="390" dy="0">GPU 生成当前候选；CPU 用历史预测准备总预算。黑竖条表示 fork / join。</tspan></text><path d="M390 330H1290" stroke="#cbd7e1" stroke-dasharray="6 5"/><text x="394" y="160" text-anchor="start" font-size="12" fill="#688096" font-weight="400"><tspan x="394" dy="0">GPU / 当前 block</tspan></text><text x="470" y="370" text-anchor="start" font-size="12" fill="#688096" font-weight="400"><tspan x="470" dy="0">CPU / 历史预算</tspan></text><path class="transition normal" d="M44 345H80" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#dspark-arrow-normal)"/><path class="transition normal" d="M320 345H410" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#dspark-arrow-normal)"/><path class="transition normal" d="M410 245H465" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#dspark-arrow-normal)"/><path class="transition normal" d="M410 445H495" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#dspark-arrow-normal)"/><path class="transition normal" d="M720 245H850" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#dspark-arrow-normal)"/><path class="transition normal" d="M940 188V166H1110V188" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#dspark-arrow-normal)"/><path class="transition normal" d="M1170 245H1250" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#dspark-arrow-normal)"/><path class="transition normal" d="M1050 455H1250" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#dspark-arrow-normal)"/><path class="transition normal" d="M1250 350H1355" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#dspark-arrow-normal)"/><path class="transition verify" d="M1457 429V610H1270V660" fill="none" stroke="#228978" stroke-width="2.1" marker-end="url(#dspark-arrow-verify)"/><path class="transition commit" d="M1120 730H975" fill="none" stroke="#8663b0" stroke-width="2.1" marker-end="url(#dspark-arrow-commit)"/><path class="transition commit" d="M675 730H539" fill="none" stroke="#8663b0" stroke-width="2.1" marker-end="url(#dspark-arrow-commit)"/><path class="transition commit" d="M501 730H200V424" fill="none" stroke="#8663b0" stroke-width="2.1" marker-end="url(#dspark-arrow-commit)"/><path class="transition normal" d="M520 749V830" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#dspark-arrow-normal)"/><circle cx="35" cy="345" r="9" fill="#213f57"/><g id="dspark-ready" class="state" data-kind="state"><rect x="80" y="285" width="240" height="139" rx="14" fill="#f7fafc" stroke="#7892a7" stroke-width="1.8"/><path d="M81 328H319" stroke="#7892a7" stroke-opacity=".3"/><text x="96" y="314" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="96" dy="0">Context ready</tspan></text><text x="96" y="354" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="96" dy="0">prefill 或上轮提交已完成</tspan><tspan x="96" dy="23">真实 H / KV 与 anchor 已知</tspan><tspan x="96" dy="23">历史 confidence 可用</tspan></text></g><rect x="407" y="200" width="6" height="245" rx="3" fill="#284a63"/><g id="dspark-backbone" class="state" data-kind="draft"><rect x="465" y="188" width="255" height="116" rx="14" fill="#edf4ff" stroke="#3974bf" stroke-width="1.8"/><path d="M466 231H719" stroke="#3974bf" stroke-opacity=".3"/><text x="481" y="217" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="481" dy="0">Backbone</tspan></text><text x="481" y="257" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="481" dy="0">do：并行 forward × 1</tspan><tspan x="481" dy="23">产出 hᵢ、基础 logits Uᵢ</tspan></text><a href="#dspark-module-m1" aria-label="查看 M1 模块"><rect x="675" y="199" width="28" height="22" rx="5" fill="#fff" stroke="#3974bf" stroke-opacity=".5"/><text x="689" y="215" text-anchor="middle" font-size="12" font-weight="650" fill="#3974bf">M1</text></a></g><g id="dspark-markov" class="state" data-kind="control"><rect x="850" y="188" width="320" height="116" rx="14" fill="#fff6e7" stroke="#b47a24" stroke-width="1.8"/><path d="M851 231H1169" stroke="#b47a24" stroke-opacity=".3"/><text x="866" y="217" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="866" dy="0">Markov 采样</tspan></text><text x="866" y="257" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="866" dy="0">do：Uᵢ + bias(prev token) → dᵢ</tspan><tspan x="866" dy="23">更新 prev token、位置 i</tspan></text><a href="#dspark-module-m2" aria-label="查看 M2 模块"><rect x="1125" y="199" width="28" height="22" rx="5" fill="#fff" stroke="#b47a24" stroke-opacity=".5"/><text x="1139" y="215" text-anchor="middle" font-size="12" font-weight="650" fill="#b47a24">M2</text></a></g><g id="dspark-budget" class="state" data-kind="control"><rect x="495" y="398" width="555" height="116" rx="14" fill="#fff6e7" stroke="#b47a24" stroke-width="1.8"/><path d="M496 441H1049" stroke="#b47a24" stroke-opacity=".3"/><text x="511" y="427" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="511" dy="0">Budget planning</tspan></text><text x="511" y="467" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="511" dy="0">历史 confidence + 本机 SPS 表 → 搜索 K</tspan><tspan x="511" dy="23">保存总预算；不读取当前未来候选来回看选 K</tspan></text></g><rect x="1247" y="245" width="6" height="210" rx="3" fill="#284a63"/><g id="dspark-plan" class="state" data-kind="control"><rect x="1355" y="290" width="205" height="139" rx="14" fill="#fff6e7" stroke="#b47a24" stroke-width="1.8"/><path d="M1356 333H1559" stroke="#b47a24" stroke-opacity=".3"/><text x="1371" y="319" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="1371" dy="0">Verify 计划</tspan></text><text x="1371" y="359" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="1371" dy="0">hᵢ / prev → cᵢ</tspan><tspan x="1371" dy="23">cumprod / 分配 K</tspan><tspan x="1371" dy="23">各请求长度 ℓᵣ 确定</tspan></text><a href="#dspark-module-m3" aria-label="查看 M3 模块"><rect x="1515" y="301" width="28" height="22" rx="5" fill="#fff" stroke="#b47a24" stroke-opacity=".5"/><text x="1529" y="317" text-anchor="middle" font-size="12" font-weight="650" fill="#b47a24">M3</text></a></g><g id="dspark-verify" class="state" data-kind="verify"><rect x="1120" y="660" width="300" height="139" rx="14" fill="#eaf7f3" stroke="#228978" stroke-width="1.8"/><path d="M1121 703H1419" stroke="#228978" stroke-opacity=".3"/><text x="1136" y="689" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="1136" dy="0">Verify 执行中</tspan></text><text x="1136" y="729" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="1136" dy="0">do：compact / ragged target</tspan><tspan x="1136" dy="23">每请求只处理所选前缀</tspan><tspan x="1136" dy="23">输入量 = 请求数 + Σℓᵣ</tspan></text></g><g id="dspark-commit" class="state" data-kind="commit"><rect x="675" y="660" width="300" height="139" rx="14" fill="#f4effb" stroke="#8663b0" stroke-width="1.8"/><path d="M676 703H974" stroke="#8663b0" stroke-opacity=".3"/><text x="691" y="689" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="691" dy="0">Commit 执行中</tspan></text><text x="691" y="729" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="691" dy="0">接受连续前缀 + correction</tspan><tspan x="691" dy="23">提交真实 KV / H</tspan><tspan x="691" dy="23">未验证 / 被拒绝后缀都丢弃</tspan></text></g><path d="M520 711 L539 730 L520 749 L501 730Z" fill="#fff9ed" stroke="#b47a24" stroke-width="1.8"/><g class="final"><circle cx="520" cy="845" r="15" fill="#fff" stroke="#213f57" stroke-width="2"/><circle cx="520" cy="845" r="9" fill="#213f57"/></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="410" y="187" text-anchor="middle" font-size="12" fill="#3f5b71" font-weight="500"><tspan x="410" dy="0">FORK</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="1250" y="232" text-anchor="middle" font-size="12" fill="#3f5b71" font-weight="500"><tspan x="1250" dy="0">JOIN</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="520" y="697" text-anchor="middle" font-size="15" fill="#3f5b71" font-weight="500"><tspan x="520" dy="0">是否结束</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="167" y="258" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="167" dy="0">prefill 完成</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="360" y="324" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="360" dy="0">开始新轮</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="785" y="225" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="785" dy="0">hᵢ / Uᵢ 就绪</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="1022" y="154" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="1022" dy="0">[i &lt; γ] / 下一位置</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="1210" y="225" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="1210" dy="0">[i = γ]</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="1150" y="435" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="1150" dy="0">K ready</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="1300" y="278" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="1300" dy="0">[两侧均就绪]</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="1370" y="577" text-anchor="middle" font-size="15" fill="#228978" font-weight="500"><tspan x="1370" dy="0">prefix 选择 / 压紧完成</tspan><tspan x="1370" dy="23">候选与长度交给 target</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="1047" y="710" text-anchor="middle" font-size="15" fill="#8663b0" font-weight="500"><tspan x="1047" dy="0">target 返回 k、a</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="608" y="710" text-anchor="middle" font-size="15" fill="#8663b0" font-weight="500"><tspan x="608" dy="0">提交完成</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="377" y="647" text-anchor="middle" font-size="15" fill="#8663b0" font-weight="500"><tspan x="377" dy="0">[继续] / 新 anchor，重新 draft</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="570" y="805" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="570" dy="0">[结束]</tspan></text></g><text x="65" y="866" text-anchor="start" font-size="15" fill="#698095" font-weight="400"><tspan x="65" dy="0">Static verify 分支：固定验证长度，可跳过 confidence / 预算调度。</tspan></text><text x="1035" y="862" text-anchor="start" font-size="15" fill="#698095" font-weight="400"><tspan x="1035" dy="0">优化边界：串行采样、动态前缀压紧。</tspan><tspan x="1035" dy="23">缩短 ℓ 后仍需同步缩小 graph padding。</tspan></text>
<path d="M50 896H1550" stroke="#e0e8ee"/><rect x="50" y="919" width="12" height="12" rx="3" fill="#edf4ff" stroke="#3974bf"/><text x="71" y="930" font-size="14" fill="#698095">draft / 预测计算</text><rect x="255" y="919" width="12" height="12" rx="3" fill="#fff6e7" stroke="#b47a24"/><text x="276" y="930" font-size="14" fill="#698095">控制 / 调度</text><rect x="460" y="919" width="12" height="12" rx="3" fill="#eaf7f3" stroke="#228978"/><text x="481" y="930" font-size="14" fill="#698095">target verify</text><rect x="665" y="919" width="12" height="12" rx="3" fill="#f4effb" stroke="#8663b0"/><text x="686" y="930" font-size="14" fill="#698095">状态提交</text><rect x="870" y="919" width="12" height="12" rx="3" fill="#fff0ed" stroke="#c16959"/><text x="891" y="930" font-size="14" fill="#698095">fallback</text><text x="1545" y="930" text-anchor="end" font-size="14" fill="#698095">箭头：事件 / [条件] → 动作　　● 初态　◎ 终态</text>
<text x="50" y="973" text-anchor="start" font-size="17" fill="#314c63" font-weight="700"><tspan x="50" dy="0">模块速览 · M 标记对应状态中执行的模型</tspan></text><text x="1550" y="973" text-anchor="end" font-size="14" fill="#698095" font-weight="400"><tspan x="1550" dy="0">B 批量 · P prefix · q/Q query · γ 预测位置 · h hidden · m 特征层数 · V 词表</tspan></text><g class="module-card" id="dspark-module-m1"><rect x="50.0" y="990" width="489.3333333333333" height="140" rx="12" fill="#f8fafc" stroke="#cbd8e2"/><rect x="65.0" y="1004" width="33" height="24" rx="5" fill="#e5eef8"/><text x="81.5" y="1022" text-anchor="middle" font-size="14" fill="#3974bf" font-weight="700"><tspan x="81.5" dy="0">M1</tspan></text><text x="109.0" y="1022" text-anchor="start" font-size="20" fill="#18364e" font-weight="700"><tspan x="109.0" dy="0">Draft backbone</tspan></text><text x="524.3333333333333" y="1021" text-anchor="end" font-size="14" fill="#698095" font-weight="400"><tspan x="524.3333333333333" dy="0">沿用</tspan></text><text x="66.0" y="1052" text-anchor="start" font-size="17" fill="#314c63" font-weight="500"><tspan x="66.0" dy="0">DFlash 式 L_d 层 Transformer + 共享 LM head</tspan></text><text x="66.0" y="1078" text-anchor="start" font-size="17" fill="#4b6479" font-weight="400"><tspan x="66.0" dy="0">H[B,P,mh] + query IDs[B,q]</tspan><tspan x="66.0" dy="23">→ Z[B,γ,h]、基础 logits U[B,γ,V]</tspan></text></g><g class="module-card" id="dspark-module-m2"><rect x="555.3333333333333" y="990" width="489.3333333333333" height="140" rx="12" fill="#f8fafc" stroke="#cbd8e2"/><rect x="570.3333333333333" y="1004" width="33" height="24" rx="5" fill="#e5eef8"/><text x="586.8333333333333" y="1022" text-anchor="middle" font-size="14" fill="#3974bf" font-weight="700"><tspan x="586.8333333333333" dy="0">M2</tspan></text><text x="614.3333333333333" y="1022" text-anchor="start" font-size="20" fill="#18364e" font-weight="700"><tspan x="614.3333333333333" dy="0">Markov head · vanilla</tspan></text><text x="1029.6666666666665" y="1021" text-anchor="end" font-size="14" fill="#698095" font-weight="400"><tspan x="1029.6666666666665" dy="0">新增</tspan></text><text x="571.3333333333333" y="1052" text-anchor="start" font-size="17" fill="#314c63" font-weight="500"><tspan x="571.3333333333333" dy="0">Embedding(V,r) + Linear(r,V)；r 常用 256</tspan></text><text x="571.3333333333333" y="1078" text-anchor="start" font-size="17" fill="#4b6479" font-weight="400"><tspan x="571.3333333333333" dy="0">prev IDs[B] → E_prev[B,r]</tspan><tspan x="571.3333333333333" dy="23">→ bias[B,V]；U_i + bias → token[B]</tspan></text></g><g class="module-card" id="dspark-module-m3"><rect x="1060.6666666666665" y="990" width="489.3333333333333" height="140" rx="12" fill="#f8fafc" stroke="#cbd8e2"/><rect x="1075.6666666666665" y="1004" width="33" height="24" rx="5" fill="#e5eef8"/><text x="1092.1666666666665" y="1022" text-anchor="middle" font-size="14" fill="#3974bf" font-weight="700"><tspan x="1092.1666666666665" dy="0">M3</tspan></text><text x="1119.6666666666665" y="1022" text-anchor="start" font-size="20" fill="#18364e" font-weight="700"><tspan x="1119.6666666666665" dy="0">Confidence head</tspan></text><text x="1534.9999999999998" y="1021" text-anchor="end" font-size="14" fill="#698095" font-weight="400"><tspan x="1534.9999999999998" dy="0">新增</tspan></text><text x="1076.6666666666665" y="1052" text-anchor="start" font-size="17" fill="#314c63" font-weight="500"><tspan x="1076.6666666666665" dy="0">Linear(h+r,1) + 温度校准 + sigmoid</tspan></text><text x="1076.6666666666665" y="1078" text-anchor="start" font-size="17" fill="#4b6479" font-weight="400"><tspan x="1076.6666666666665" dy="0">concat(Z[B,γ,h], E_prev[B,γ,r])</tspan><tspan x="1076.6666666666665" dy="23">→ c[B,γ]；cumprod 得前缀存活概率</tspan></text></g><text x="50" y="1153" text-anchor="start" font-size="14" fill="#698095" font-weight="400"><tspan x="50" dy="0">形状以共享 h 的 Qwen3-8B 式模型为例：h=4096；L_d、m 依 checkpoint；γ 为选取后的预测位置数。共享 LM head = Linear(h,V)。</tspan></text>
</svg>