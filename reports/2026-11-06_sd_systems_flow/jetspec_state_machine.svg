<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170" role="img" aria-label="JetSpec 状态机">
<title>JetSpec · 横版状态机</title><desc>包含 CPU 构树循环、target tree verify，以及 gather 和 logical-map 两种 KV 提交分支。</desc>
<defs><marker id="jetspec-arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#607b91"/></marker><marker id="jetspec-arrow-miss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#bf6556"/></marker><marker id="jetspec-arrow-commit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#8663b0"/></marker><marker id="jetspec-arrow-verify" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#228978"/></marker><marker id="jetspec-arrow-draft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#3974bf"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}.state:hover rect{filter:brightness(.98)}.edge-label{pointer-events:none}</style>
<rect width="1600" height="1170" fill="#fff"/><rect x="1070" y="95" width="450" height="235" rx="22" fill="#fbfcfe" stroke="#bdccd8" stroke-width="1.6" stroke-dasharray="7 5"/><text x="1090" y="124" text-anchor="start" font-size="18" fill="#314c63" font-weight="700"><tspan x="1090" dy="0">CPU CONTROL · 本地默认 builder</tspan></text><text x="1090" y="148" text-anchor="start" font-size="14" fill="#688096" font-weight="400"><tspan x="1090" dy="0">top-k 有 D2H；树 / ancestor 元数据回到 GPU。</tspan></text><path class="transition normal" d="M44 220H80" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#jetspec-arrow-normal)"/><path class="transition normal" d="M325 220H420" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#jetspec-arrow-normal)"/><path class="transition normal" d="M700 220H795" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#jetspec-arrow-normal)"/><path class="transition normal" d="M1000 220H1100" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#jetspec-arrow-normal)"/><path class="transition normal" d="M1195 180V61H1440V180" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#jetspec-arrow-normal)"/><path class="transition verify" d="M1292 296V465" fill="none" stroke="#228978" stroke-width="2.1" marker-end="url(#jetspec-arrow-verify)"/><path class="transition verify" d="M1190 535H1075" fill="none" stroke="#228978" stroke-width="2.1" marker-end="url(#jetspec-arrow-verify)"/><path class="transition normal" d="M795 535H719" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#jetspec-arrow-normal)"/><path class="transition commit" d="M681 535H650V493H620" fill="none" stroke="#8663b0" stroke-width="2.1" marker-end="url(#jetspec-arrow-commit)"/><path class="transition commit" d="M700 554V738H665" fill="none" stroke="#8663b0" stroke-width="2.1" marker-end="url(#jetspec-arrow-commit)"/><path class="transition commit" d="M405 493H325" fill="none" stroke="#8663b0" stroke-width="2.1" marker-end="url(#jetspec-arrow-commit)"/><path class="transition commit" d="M405 738H350V555H325" fill="none" stroke="#8663b0" stroke-width="2.1" marker-end="url(#jetspec-arrow-commit)"/><path class="transition commit" d="M200 435V281" fill="none" stroke="#8663b0" stroke-width="2.1" marker-end="url(#jetspec-arrow-commit)"/><path class="transition normal" d="M200 574V760" fill="none" stroke="#607b91" stroke-width="2.1" marker-end="url(#jetspec-arrow-normal)"/><circle cx="35" cy="220" r="9" fill="#213f57"/><g id="jetspec-ready" class="state" data-kind="state"><rect x="80" y="165" width="245" height="116" rx="14" fill="#f7fafc" stroke="#7892a7" stroke-width="1.8"/><path d="M81 208H324" stroke="#7892a7" stroke-opacity=".3"/><text x="96" y="194" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="96" dy="0">Context ready</tspan></text><text x="96" y="234" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="96" dy="0">真实 prefix KV / H</tspan><tspan x="96" dy="23">当前 anchor 已确认</tspan></text></g><g id="jetspec-draft" class="state" data-kind="draft"><rect x="420" y="165" width="280" height="116" rx="14" fill="#edf4ff" stroke="#3974bf" stroke-width="1.8"/><path d="M421 208H699" stroke="#3974bf" stroke-opacity=".3"/><text x="436" y="194" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="436" dy="0">Causal draft</tspan></text><text x="436" y="234" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="436" dy="0">do：并行 forward × 1</tspan><tspan x="436" dy="23">得到各深度 logits</tspan></text><a href="#jetspec-module-m1" aria-label="查看 M1 模块"><rect x="622" y="176" width="28" height="22" rx="5" fill="#fff" stroke="#3974bf" stroke-opacity=".5"/><text x="636" y="192" text-anchor="middle" font-size="12" font-weight="650" fill="#3974bf">M1</text></a><a href="#jetspec-module-m2" aria-label="查看 M2 模块"><rect x="655" y="176" width="28" height="22" rx="5" fill="#fff" stroke="#3974bf" stroke-opacity=".5"/><text x="669" y="192" text-anchor="middle" font-size="12" font-weight="650" fill="#3974bf">M2</text></a></g><g id="jetspec-topk" class="state" data-kind="control"><rect x="795" y="165" width="205" height="116" rx="14" fill="#fff6e7" stroke="#b47a24" stroke-width="1.8"/><path d="M796 208H999" stroke="#b47a24" stroke-opacity=".3"/><text x="811" y="194" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="811" dy="0">Top-k ready</tspan></text><text x="811" y="234" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="811" dy="0">每深度候选与分数</tspan><tspan x="811" dy="23">等待 tree builder</tspan></text></g><g id="jetspec-tree" class="state" data-kind="control"><rect x="1100" y="180" width="385" height="116" rx="14" fill="#fff6e7" stroke="#b47a24" stroke-width="1.8"/><path d="M1101 223H1484" stroke="#b47a24" stroke-opacity=".3"/><text x="1116" y="209" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="1116" dy="0">Tree building</tspan></text><text x="1116" y="249" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="1116" dy="0">heap 扩展候选；构造 ancestor</tspan><tspan x="1116" dy="23">节点数 / 深度 / 宽度受预算限制</tspan></text></g><g id="jetspec-verify" class="state" data-kind="verify"><rect x="1190" y="465" width="300" height="139" rx="14" fill="#eaf7f3" stroke="#228978" stroke-width="1.8"/><path d="M1191 508H1489" stroke="#228978" stroke-opacity=".3"/><text x="1206" y="494" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="1206" dy="0">Tree verify 执行中</tspan></text><text x="1206" y="534" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="1206" dy="0">do：N 节点 target forward</tspan><tspan x="1206" dy="23">每节点只看 prefix + 自身祖先</tspan><tspan x="1206" dy="23">KV 暂存在各节点槽位</tspan></text></g><g id="jetspec-accept" class="state" data-kind="control"><rect x="795" y="465" width="280" height="139" rx="14" fill="#fff6e7" stroke="#b47a24" stroke-width="1.8"/><path d="M796 508H1074" stroke="#b47a24" stroke-opacity=".3"/><text x="811" y="494" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="811" dy="0">Path selection</tspan></text><text x="811" y="534" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="811" dy="0">从 root 找到接受路径</tspan><tspan x="811" dy="23">产生 correction / bonus</tspan><tspan x="811" dy="23">路径索引用于 KV / H 提交</tspan></text></g><path d="M700 516 L719 535 L700 554 L681 535Z" fill="#fff9ed" stroke="#b47a24" stroke-width="1.8"/><g id="jetspec-gather" class="state" data-kind="commit"><rect x="405" y="435" width="215" height="116" rx="14" fill="#f4effb" stroke="#8663b0" stroke-width="1.8"/><path d="M406 478H619" stroke="#8663b0" stroke-opacity=".3"/><text x="421" y="464" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="421" dy="0">KV gather</tspan></text><text x="421" y="504" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="421" dy="0">按路径整理有效 KV</tspan><tspan x="421" dy="23">回收被拒绝分支</tspan></text></g><g id="jetspec-logical" class="state" data-kind="commit"><rect x="405" y="680" width="260" height="116" rx="14" fill="#f4effb" stroke="#8663b0" stroke-width="1.8"/><path d="M406 723H664" stroke="#8663b0" stroke-opacity=".3"/><text x="421" y="709" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="421" dy="0">逻辑映射提交</tspan></text><text x="421" y="749" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="421" dy="0">KV 保留原物理槽位</tspan><tspan x="421" dy="23">仅更新有效逻辑映射</tspan></text></g><g id="jetspec-commit" class="state" data-kind="commit"><rect x="80" y="435" width="245" height="139" rx="14" fill="#f4effb" stroke="#8663b0" stroke-width="1.8"/><path d="M81 478H324" stroke="#8663b0" stroke-opacity=".3"/><text x="96" y="464" text-anchor="start" font-size="22" fill="#18364e" font-weight="700"><tspan x="96" dy="0">Context committed</tspan></text><text x="96" y="504" text-anchor="start" font-size="18" fill="#314c63" font-weight="400"><tspan x="96" dy="0">追加接受路径的真实 H</tspan><tspan x="96" dy="23">输出 tokens 与新 anchor</tspan><tspan x="96" dy="23">提交完成后进入下一轮</tspan></text></g><g class="final"><circle cx="200" cy="775" r="15" fill="#fff" stroke="#213f57" stroke-width="2"/><circle cx="200" cy="775" r="9" fill="#213f57"/></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="700" y="502" text-anchor="middle" font-size="15" fill="#3f5b71" font-weight="500"><tspan x="700" dy="0">KV backend</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="169" y="140" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="169" dy="0">prefill 完成</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="372" y="200" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="372" dy="0">开始本轮</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="748" y="200" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="748" dy="0">forward 完成</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="1050" y="199" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="1050" dy="0">D2H</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="1320" y="42" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="1320" dy="0">[可继续扩展] / heap 下一节点</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="1350" y="376" text-anchor="middle" font-size="15" fill="#228978" font-weight="500"><tspan x="1350" dy="0">[预算到达 / 候选耗尽]</tspan><tspan x="1350" dy="23">H2D：tokens / parents / ancestor</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="1135" y="444" text-anchor="middle" font-size="15" fill="#228978" font-weight="500"><tspan x="1135" dy="0">target logits 就绪</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="756" y="570" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="756" dy="0">path ready</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="653" y="468" text-anchor="middle" font-size="15" fill="#8663b0" font-weight="500"><tspan x="653" dy="0">[gather]</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="763" y="657" text-anchor="middle" font-size="15" fill="#8663b0" font-weight="500"><tspan x="763" dy="0">[no-gather]</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="365" y="472" text-anchor="middle" font-size="15" fill="#8663b0" font-weight="500"><tspan x="365" dy="0">提交有效 KV</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="260" y="707" text-anchor="middle" font-size="15" fill="#8663b0" font-weight="500"><tspan x="260" dy="0">提交有效映射</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="318" y="366" text-anchor="middle" font-size="15" fill="#8663b0" font-weight="500"><tspan x="318" dy="0">[继续] / 新 anchor、H</tspan></text></g><g class="edge-label" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"><text x="116" y="670" text-anchor="middle" font-size="15" fill="#607b91" font-weight="500"><tspan x="116" dy="0">[EOS / budget]</tspan></text></g><text x="800" y="775" text-anchor="start" font-size="15" fill="#698095" font-weight="400"><tspan x="800" dy="0">树是当前轮多个可能前缀的表示；target 最终只提交其中一条路径。</tspan><tspan x="800" dy="23">gather 是设备内缓存整理，不是 TP collective。</tspan><tspan x="800" dy="23">可选 conditioned extension 会增加 draft forward，不在本基本状态机内。</tspan></text><text x="80" y="864" text-anchor="start" font-size="15" fill="#698095" font-weight="400"><tspan x="80" dy="0">优化边界：CPU 构树与同步、ancestor / mask、N 节点 target attention、路径 KV 提交。</tspan></text>
<path d="M50 896H1550" stroke="#e0e8ee"/><rect x="50" y="919" width="12" height="12" rx="3" fill="#edf4ff" stroke="#3974bf"/><text x="71" y="930" font-size="14" fill="#698095">draft / 预测计算</text><rect x="255" y="919" width="12" height="12" rx="3" fill="#fff6e7" stroke="#b47a24"/><text x="276" y="930" font-size="14" fill="#698095">控制 / 调度</text><rect x="460" y="919" width="12" height="12" rx="3" fill="#eaf7f3" stroke="#228978"/><text x="481" y="930" font-size="14" fill="#698095">target verify</text><rect x="665" y="919" width="12" height="12" rx="3" fill="#f4effb" stroke="#8663b0"/><text x="686" y="930" font-size="14" fill="#698095">状态提交</text><rect x="870" y="919" width="12" height="12" rx="3" fill="#fff0ed" stroke="#c16959"/><text x="891" y="930" font-size="14" fill="#698095">fallback</text><text x="1545" y="930" text-anchor="end" font-size="14" fill="#698095">箭头：事件 / [条件] → 动作　　● 初态　◎ 终态</text>
<text x="50" y="973" text-anchor="start" font-size="17" fill="#314c63" font-weight="700"><tspan x="50" dy="0">模块速览 · M 标记对应状态中执行的模型</tspan></text><text x="1550" y="973" text-anchor="end" font-size="14" fill="#698095" font-weight="400"><tspan x="1550" dy="0">B 批量 · P prefix · q/Q query · γ 预测位置 · h hidden · m 特征层数 · V 词表</tspan></text><g class="module-card" id="jetspec-module-m1"><rect x="50.0" y="990" width="742.0" height="140" rx="12" fill="#f8fafc" stroke="#cbd8e2"/><rect x="65.0" y="1004" width="33" height="24" rx="5" fill="#e5eef8"/><text x="81.5" y="1022" text-anchor="middle" font-size="14" fill="#3974bf" font-weight="700"><tspan x="81.5" dy="0">M1</tspan></text><text x="109.0" y="1022" text-anchor="start" font-size="20" fill="#18364e" font-weight="700"><tspan x="109.0" dy="0">Causal draft model</tspan></text><text x="777.0" y="1021" text-anchor="end" font-size="14" fill="#698095" font-weight="400"><tspan x="777.0" dy="0">改动</tspan></text><text x="66.0" y="1052" text-anchor="start" font-size="17" fill="#314c63" font-weight="500"><tspan x="66.0" dy="0">L_d 层 Transformer · block 内 causal attention</tspan></text><text x="66.0" y="1078" text-anchor="start" font-size="17" fill="#4b6479" font-weight="400"><tspan x="66.0" dy="0">真实 H[B,P,mh] + query IDs[B,q]</tspan><tspan x="66.0" dy="23">→ 各深度 logits U[B,γ,V] → top-k / 构树</tspan></text></g><g class="module-card" id="jetspec-module-m2"><rect x="808.0" y="990" width="742.0" height="140" rx="12" fill="#f8fafc" stroke="#cbd8e2"/><rect x="823.0" y="1004" width="33" height="24" rx="5" fill="#e5eef8"/><text x="839.5" y="1022" text-anchor="middle" font-size="14" fill="#3974bf" font-weight="700"><tspan x="839.5" dy="0">M2</tspan></text><text x="867.0" y="1022" text-anchor="start" font-size="20" fill="#18364e" font-weight="700"><tspan x="867.0" dy="0">Context converter · 特征投影</tspan></text><text x="1535.0" y="1021" text-anchor="end" font-size="14" fill="#698095" font-weight="400"><tspan x="1535.0" dy="0">沿用</tspan></text><text x="824.0" y="1052" text-anchor="start" font-size="17" fill="#314c63" font-weight="500"><tspan x="824.0" dy="0">Linear(mh,h) + RMSNorm；位于 draft 内部</tspan></text><text x="824.0" y="1078" text-anchor="start" font-size="17" fill="#4b6479" font-weight="400"><tspan x="824.0" dy="0">H[B,P,mh] → C[B,P,h] → 各层 prefix K/V</tspan><tspan x="824.0" dy="23">仅投影已知特征；不是 JetSpec++ 的预测式 adapter</tspan></text></g><text x="50" y="1153" text-anchor="start" font-size="14" fill="#698095" font-weight="400"><tspan x="50" dy="0">形状以共享 h 的 Qwen3-8B 式模型为例：h=4096；L_d、m 依 checkpoint；γ 为选取后的预测位置数。共享 LM head = Linear(h,V)。</tspan></text>
</svg>